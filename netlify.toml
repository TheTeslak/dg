[build]
command = "pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "11"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
